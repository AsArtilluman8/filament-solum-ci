name: Yoru Drift Street Culture Stock Fetch

on:
  push:
    branches:
      - agent/yoru-drift-stock-fetch
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch-street-culture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download and compress licensed Pexels street-culture footage
        shell: bash
        run: |
          set -u
          mkdir -p street raw

          fetch_clip() {
            local file="$1"
            local id="$2"
            echo "Fetching Pexels $id -> $file"
            if ! curl -L --fail --retry 4 --retry-delay 2 --max-time 600 -o "raw/$file" "https://www.pexels.com/download/video/$id/"; then
              echo "SKIP: download failed for $id"
              rm -f "raw/$file"
              return 0
            fi
            if ! ffmpeg -hide_banner -loglevel error -y -t 16 -i "raw/$file" -an \
              -vf "scale=1280:1280:force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2,fps=30" \
              -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -movflags +faststart \
              "street/$file"; then
              echo "SKIP: encode failed for $id"
              rm -f "street/$file"
            fi
            rm -f "raw/$file"
          }

          fetch_clip 26_night_skate_trick.mp4 8565343
          fetch_clip 27_gritty_night_skate.mp4 5422532
          fetch_clip 28_blue_night_skate.mp4 28985119
          fetch_clip 29_car_meet_burnout.mp4 27974758
          fetch_clip 30_neon_muscle_burnout.mp4 30843746
          fetch_clip 31_tuned_cars_parking.mp4 30418725
          fetch_clip 32_breakdance_spin.mp4 6548147
          fetch_clip 33_breakdance_street_woman.mp4 8715155
          fetch_clip 34_neon_friends_car.mp4 10385869

          printf '%s\n' \
            'Pexels source IDs: 8565343, 5422532, 28985119, 27974758, 30843746, 30418725, 6548147, 8715155, 10385869' \
            'License: https://www.pexels.com/license/' > street/SOURCES_STREET.txt
          ls -lh street
          test "$(find street -name '*.mp4' | wc -l)" -ge 5

      - name: Upload street culture stock bundle
        uses: actions/upload-artifact@v4
        with:
          name: yoru-drift-street-culture-stock
          path: street/
          compression-level: 0
          retention-days: 1
