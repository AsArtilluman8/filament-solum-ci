name: Yoru Drift Director Cut Stock Fetch

on:
  push:
    branches:
      - agent/yoru-drift-stock-fetch
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch-directors-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download additional licensed Pexels road and drift footage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p directors_cut
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/11_mountain_drift_white_car.mp4 "https://www.pexels.com/download/video/36223826/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/12_two_cars_drift_track.mp4 "https://www.pexels.com/download/video/9330847/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/13_orange_nissan_drift.mp4 "https://www.pexels.com/download/video/14854561/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/14_drift_through_smoke.mp4 "https://www.pexels.com/download/video/26202701/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/15_black_bmw_drift.mp4 "https://www.pexels.com/download/video/28545969/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/16_night_highway_city_lights.mp4 "https://www.pexels.com/download/video/35677223/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/17_high_speed_tunnel.mp4 "https://www.pexels.com/download/video/31196468/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/18_speeding_city_night.mp4 "https://www.pexels.com/download/video/31196474/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/19_japanese_night_traffic.mp4 "https://www.pexels.com/download/video/29215132/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/20_highway_passing_cars.mp4 "https://www.pexels.com/download/video/31940329/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/21_black_car_mountain_roads.mp4 "https://www.pexels.com/download/video/32486198/"
          curl -L --fail --retry 4 --retry-delay 2 -o directors_cut/22_night_road_timelapse.mp4 "https://www.pexels.com/download/video/27758000/"
          printf '%s\n' \
            'Pexels source IDs: 36223826, 9330847, 14854561, 26202701, 28545969, 35677223, 31196468, 31196474, 29215132, 31940329, 32486198, 27758000' \
            'License: https://www.pexels.com/license/' > directors_cut/SOURCES_DIRECTORS_CUT.txt
          ls -lh directors_cut
      - name: Upload directors cut stock bundle
        uses: actions/upload-artifact@v4
        with:
          name: yoru-drift-directors-cut-stock
          path: directors_cut/
          compression-level: 0
          retention-days: 1
